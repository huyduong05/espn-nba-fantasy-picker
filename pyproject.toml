[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "espn-nba-fantasy-picker"
version = "0.1.0"
description = "Local nine-category NBA fantasy draft recommendation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2026.7.22",
  "Flask>=3.1,<4",
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6,<7",
]

[project.scripts]
fantasy-picker = "fantasy_picker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

