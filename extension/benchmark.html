<!doctype html>
<html lang="en">
  <head>

    <title>Fantasy Picker benchmark</title>
    <style>
      body {
        max-width: 900px;
        margin: 32px auto;
        font:
          16px system-ui,
          sans-serif;
      }
      button {
        font: inherit;
        padding: 8px 12px;
      }
      pre {
        overflow: auto;
        padding: 16px;
        background: #111827;
        color: #f9fafb;
      }
